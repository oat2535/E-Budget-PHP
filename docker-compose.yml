services:
  web:
    container_name: e-budget-web-uat
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5890:8000"
    environment:
      # Application Core Settings
      APP_NAME: "${APP_NAME:-E-Budget}"
      APP_ENV: "${APP_ENV:-uat}"
      APP_KEY: "${APP_KEY:-base64:smX7kWz7o6sQg0LsxsSgBK2O3GYg0CMVR77x3tq+byw=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Bangkok}"
      APP_URL: "${APP_URL:-https://uat-e-budget.thonglorpet.com}"
      ASSET_URL: "${ASSET_URL:-https://uat-e-budget.thonglorpet.com}"
      SERVER_NAME: ":8000"

      # Session & Cache (File-based: fast, reliable, zero extra DB tables)
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"

      # 1. Project Database (imedx_tlp_for_it / schema: intra_tl)
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-192.168.98.254}"
      DB_PORT: "${DB_PORT:-5434}"
      DB_DATABASE: "${DB_DATABASE:-imedx_tlp_for_it}"
      DB_USERNAME: "${DB_USERNAME:-eservices}"
      DB_PASSWORD: "${DB_PASSWORD:-Tlp@2023}"
      DB_SCHEMA: "${DB_SCHEMA:-intra_tl}"

      # Project Database Legacy Aliases (Django compatibility)
      DB_DEFAULT_HOST: "${DB_DEFAULT_HOST:-192.168.98.254}"
      DB_DEFAULT_PORT: "${DB_DEFAULT_PORT:-5434}"
      DB_DEFAULT_NAME: "${DB_DEFAULT_NAME:-imedx_tlp_for_it}"
      DB_DEFAULT_USER: "${DB_DEFAULT_USER:-eservices}"
      DB_DEFAULT_PASSWORD: "${DB_DEFAULT_PASSWORD:-Tlp@2023}"
      DB_DEFAULT_SEARCH_PATH: "${DB_DEFAULT_SEARCH_PATH:-intra_tl}"

      # 2. iMedX User & Branch Database (imedx_uat / schema: public)
      DB_IMEDX_HOST: "${DB_IMEDX_HOST:-192.168.98.254}"
      DB_IMEDX_PORT: "${DB_IMEDX_PORT:-5434}"
      DB_IMEDX_DATABASE: "${DB_IMEDX_DATABASE:-imedx_uat}"
      DB_IMEDX_USERNAME: "${DB_IMEDX_USERNAME:-eservices}"
      DB_IMEDX_PASSWORD: "${DB_IMEDX_PASSWORD:-Tlp@2023}"
      DB_IMEDX_SCHEMA: "${DB_IMEDX_SCHEMA:-public}"
      DB_IMEDX_NAME: "${DB_IMEDX_NAME:-imedx_uat}"
      DB_IMEDX_USER: "${DB_IMEDX_USER:-eservices}"

      # Reverse Proxy & SSL Trust
      TRUSTED_PROXIES: "*"
    volumes:
      - ebudget_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ebudget_storage:
    name: e-budget-uat-storage
